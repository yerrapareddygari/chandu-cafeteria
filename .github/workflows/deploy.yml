name: Build & Deploy

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ── Build & Push Backend ──
  backend:
    name: Backend — Build & Push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push backend to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/chandu-cafeteria-backend:latest
            ${{ secrets.DOCKERHUB_USER }}/chandu-cafeteria-backend:${{ github.sha }}

  # ── Build & Push Frontend ──
  frontend:
    name: Frontend — Build & Push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push frontend to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=https://chandu-cafeteria-api.onrender.com
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/chandu-cafeteria-frontend:latest
            ${{ secrets.DOCKERHUB_USER }}/chandu-cafeteria-frontend:${{ github.sha }}