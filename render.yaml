services:
  # ── Backend (Docker) ──
  - type: web
    name: chandu-cafeteria-api
    runtime: docker
    plan: standard
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "480"
      - key: MONGO_MAX_POOL_SIZE
        value: "200"
      - key: MONGO_MIN_POOL_SIZE
        value: "20"

  # ── Frontend (Docker) ──
  - type: web
    name: chandu-cafeteria-frontend
    runtime: docker
    plan: standard
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /
    envVars:
      - key: VITE_API_URL
        value: https://chandu-cafeteria-api.onrender.com